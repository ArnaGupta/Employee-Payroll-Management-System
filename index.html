<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="school-title">ABC College of Engineering</h1>

    <p id="student-name">Name: Your Name</p>
    <p class="info">Branch: CSE</p>
    <p class="info">Year: 1st</p>

    <h2>Marks</h2>
    <ul id="marks">
        <li class="subject">Maths: 80</li>
        <li class="subject">Physics: 70</li>
        <li class="subject">Programming: 90</li>
    </ul>

    <div class="result-box">
        <p id="total">Total: --</p>
        <p id="percent">Percentage: --</p>
    </div>

    <!-- Script is at the end of body so all elements already exist when JS runs -->
    <script src="script.js"></script>
</body>
</html>
